name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / JDK ${{ matrix.java }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ["8", "11", "21"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Compile and test
        run: mvn --batch-mode --no-transfer-progress verify

  runtime-image:
    name: JDK 21 runtime image / Ubuntu
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build runtime image and executable JAR
        run: mvn --batch-mode --no-transfer-progress package -Pruntime-image
      - name: Release metadata
        shell: bash
        run: |
          mvn --batch-mode --no-transfer-progress dependency:list \
            -DincludeScope=runtime -DoutputFile=distribution/target/DEPENDENCIES.txt
          java -version 2> distribution/target/BUILD-JAVA.txt
          printf 'LazyJVM %s\nOS=%s\nARCH=%s\n' \
            '0.1.0-SNAPSHOT' '${{ runner.os }}' '${{ runner.arch }}' \
            > distribution/target/VERSION.txt
      - name: Checksums
        shell: bash
        run: |
          find distribution/target -maxdepth 1 -type f \( -name 'lazyjvm*.jar' -o -name 'lazyjvm*.zip' \) -print0 |
            xargs -0 shasum -a 256 > distribution/target/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: lazyjvm-${{ runner.os }}-${{ runner.arch }}
          path: |
            distribution/target/lazyjvm-*-all.jar
            distribution/target/lazyjvm-*.zip
            distribution/target/maven-jlink/
            distribution/target/SHA256SUMS
            distribution/target/DEPENDENCIES.txt
            distribution/target/BUILD-JAVA.txt
            distribution/target/VERSION.txt
